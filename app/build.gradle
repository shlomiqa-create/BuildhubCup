plugins { id 'com.android.application' }

android {
    namespace 'com.buildhubs.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buildhubs.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // OCR native libraries: only the phone architectures (keeps the APK smaller)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.7.0'
    // document scanner (finds the page, straightens it, removes shadows): needs Google Play services on the phone
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // unit tests (run in GitHub Actions before the APK is built); they use made-up data only
    testImplementation 'junit:junit:4.13.2'

}
