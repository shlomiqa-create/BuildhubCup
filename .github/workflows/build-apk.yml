name: Build Hubs APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Report failed tests
        if: failure()
        run: |
          grep -h -B1 "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -40 | sed 's/^/::error::/' || true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Build-Hubs-debug
          path: app/build/outputs/apk/debug/app-debug.apk
